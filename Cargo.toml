[package]
name = "scbw"
version = "0.1.0"
edition = "2024"

[dependencies]
explode = "0.1.2"
flate2 = "1.1.10"
web-time = "1.1.0"
# X11 only (Xwayland on a Wayland desktop): minifb 0.29's Wayland backend loses the mouse
# wheel (an AxisStop in the same batch as its Axis zeroes the scroll before it is read).
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }
png = "0.18.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "vorbis"] }

# Browser build (web/build.sh): minifb draws into a canvas, cpal plays through WebAudio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.17.3", features = ["wasm-bindgen"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Performance", "console", "Document", "Element", "EventTarget", "KeyboardEvent"] }
console_error_panic_hook = "0.1"

# Native networking (src/net/transport.rs): WebTransport over QUIC, ring crypto backend
# (no cmake/nasm), a tokio runtime on a thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed", "dangerous-configuration"] }
tokio = { version = "=1.48.0", features = ["rt", "net", "time", "sync", "macros"] }
