[package]
name = "scbw"
version = "0.1.0"
edition = "2024"

[dependencies]
explode = "0.1.2"
flate2 = "1.1.10"
minifb = "0.29.0"
png = "0.18.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "vorbis"] }

# Browser build (web/build.sh): minifb draws into a canvas, cpal plays through WebAudio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.17.3", features = ["wasm-bindgen"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Performance", "console"] }
console_error_panic_hook = "0.1"
