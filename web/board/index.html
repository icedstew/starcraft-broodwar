<!doctype html>
<!--
Campaign board editor (agent/plans/campaign-board.md). Open this file in a browser (file://).
Load a world.txt (from `scbw campaign gen`, or start empty) and a PNG board image, lay out the
areas as polygons (flood fill or by hand), connect areas (borders = matches) and place the
battle squares. Save writes world.txt (with a `board` line) and <world>.board.json; keep the
PNG next to the JSON. `?test` runs the self-test.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Board Editor</title>
<style>
:root { --bg: #11161b; --panel: #1a2128; --line: #2c3742; --text: #d8e0e6; --dim: #8a98a4; --accent: #39d0c0; --warn: #f0b040; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 320px; }
header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
button, label.btn { background: #24303a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
button:hover, label.btn:hover { border-color: var(--dim); }
button.on { background: var(--accent); color: #062420; border-color: var(--accent); }
label.btn input { display: none; }
#wrap { position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
#hint { position: absolute; left: 8px; bottom: 6px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 0 3px #000; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; }
input[type=text], select, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
textarea { font: 12px ui-monospace, monospace; height: 110px; resize: vertical; }
.row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.row > span { color: var(--dim); min-width: 74px; font-size: 12px; }
.row input[type=range] { flex: 1; }
#areas { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; }
#areas div { padding: 2px 6px; cursor: pointer; display: flex; gap: 6px; }
#areas div.sel { background: #24303a; }
#areas div .np { color: var(--warn); margin-left: auto; font-size: 12px; }
#warn div { color: var(--warn); font-size: 12px; }
.dim { color: var(--dim); font-size: 12px; }
@media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; } aside { border-left: 0; } }
</style>
</head>
<body>
<header>
  <label class="btn">World…<input type="file" id="fworld" accept=".txt,text/plain"></label>
  <label class="btn">Image…<input type="file" id="fimage" accept="image/png"></label>
  <label class="btn">Board…<input type="file" id="fboard" accept=".json,application/json"></label>
  <button id="save">Save</button>
  <span class="sep"></span>
  <button data-mode="areas" title="Select, move, add areas (1)">Areas</button>
  <button data-mode="fill" title="Click inside a region to make the selected area's polygon; Shift adds (2)">Fill</button>
  <button data-mode="poly" title="Edit polygon points (3)">Polygon</button>
  <button data-mode="connect" title="Click two areas to toggle a border; drag squares (4)">Connect</button>
  <span class="sep"></span>
  <button id="preview" title="Hide editing marks (P)">Preview</button>
  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="fitview" title="Fit view (F)">Fit</button>
  <span id="status" class="dim"></span>
</header>
<div id="wrap"><canvas id="cv"></canvas><div id="hint"></div></div>
<aside>
  <section>
    <h2>Area</h2>
    <div id="areaedit" class="dim">No area selected.</div>
    <div class="row"><button id="addarea">Add area</button><button id="delarea">Delete</button><button id="clearpoly">Clear polygon</button></div>
    <div id="areas"></div>
  </section>
  <section id="fillbox">
    <h2>Fill</h2>
    <div class="row"><span>Tolerance</span><input type="range" id="tol" min="0" max="255" value="40"><b id="tolv"></b></div>
    <div class="row"><span>Grow px</span><input type="range" id="grow" min="0" max="12" value="2"><b id="growv"></b></div>
    <div class="row"><span>Simplify px</span><input type="range" id="eps" min="0" max="20" step="0.5" value="2"><b id="epsv"></b></div>
  </section>
  <section>
    <h2>Border</h2>
    <div id="borderedit" class="dim">No border selected.</div>
  </section>
  <section>
    <h2>Board</h2>
    <div class="row"><span>Fill alpha</span><input type="range" id="falpha" min="0" max="1" step="0.05"><b id="falphav"></b></div>
    <div class="row"><span>Outline alpha</span><input type="range" id="oalpha" min="0" max="1" step="0.05"><b id="oalphav"></b></div>
    <div class="row"><button id="fitareas" title="Scale area points into the image">Fit areas to image</button><button id="autolayout" title="Area points to polygon centres; squares onto shared borders, spread apart">Auto layout</button></div>
  </section>
  <section>
    <h2>Factions, pool, rules</h2>
    <textarea id="head" spellcheck="false"></textarea>
    <div class="dim">world.txt lines other than area / border / board (faction, pool, eliminated).</div>
  </section>
  <section><h2>Checks</h2><div id="warn"></div></section>
</aside>
<script src="board.js"></script>
</body>
</html>
